name: Pages (público)

# Publica el sitio ensamblado por scripts/build-pages.mjs: la app completa, incluido
# el Plan 300 (decisión del 2026-11-13). Nunca sube el binario Zig, PDFs, Markdown
# del libro ni las fuentes de audio.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests de frontera y del reproductor
        run: node --test tests/build-boundary.test.mjs tests/day-player.test.js tests/app-audio.test.js
      - name: Ensamblar sitio público
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
