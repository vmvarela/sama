<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SAMA</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SAMA">
  <meta name="theme-color" content="#f5f5f0">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./tracker.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="./icons/icon-180.png" alt="SAMA" class="brand-logo" width="36" height="36">
      <h1 class="brand-title">SAMA</h1>
    </div>
    <nav class="mode-nav">
      <button id="mode-yoga" class="mode-btn active">Yoga</button>
      <button id="mode-meditation" class="mode-btn">Meditación</button>
      <button id="mode-plan" class="mode-btn">Plan 300</button>
    </nav>
    <div class="session-info">
      <span id="session-name">Secuencia</span>
      <span id="timer">00:00</span>
    </div>
  </header>

  <main>
    <div class="pose-card">
      <img id="pose-image" src="" alt="Postura" />
      <h2 id="pose-name">Postura</h2>
      <p id="pose-instruction" class="instruction"></p>
      <p id="pose-breath" class="breath"></p>
    </div>

    <div class="controls">
      <button id="prev-btn">◀ Anterior</button>
      <button id="play-btn">▶ Iniciar</button>
      <button id="next-btn">Siguiente ▶</button>
      <button id="music-btn">♪ Música</button>
    </div>

    <div class="progress">
      <div id="progress-bar"></div>
    </div>
    <p id="progress-text">0 / 0</p>

    <section id="tracker-view" class="tracker" hidden>
      <div id="day-player-card" class="tracker-card day-player" hidden tabindex="-1" aria-label="Reproductor de práctica diaria">
        <div class="day-player-header">
          <div>
            <span id="day-player-kicker" class="day-player-kicker">Práctica diaria</span>
            <h3 id="day-player-heading" class="day-player-title">Día 1</h3>
          </div>
          <button type="button" id="day-player-close" class="day-player-close" aria-label="Cerrar práctica">✕</button>
        </div>

        <div class="day-player-progress-wrap">
          <div class="progress"><div id="day-player-bar"></div></div>
          <p id="day-player-counter" class="day-player-step-counter">Paso 1</p>
        </div>

        <div id="day-player-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <div id="day-player-pose-area">
          <div id="day-player-image-wrap" class="day-player-image-wrap"></div>
          <div class="day-player-pose-header">
            <h4 id="day-player-pose-name"></h4>
            <span id="day-player-pose-fig" class="tracker-fig"></span>
            <span id="day-player-side" class="day-player-badge" hidden></span>
          </div>

          <p id="day-player-instruction" class="day-player-instruction" hidden></p>
          <div id="day-player-notes" class="day-player-notes" hidden></div>

          <div class="day-player-timer-block">
            <div id="day-player-time" class="day-player-time" aria-label="Tiempo restante">00:00</div>
            <p id="day-player-timing-desc" class="day-player-timing-desc"></p>
            <span id="day-player-status" class="day-player-status-badge" hidden></span>
          </div>

          <div id="day-player-range-options" class="day-player-range-options" hidden>
            <span class="day-player-range-label">Selecciona duración:</span>
            <div class="day-player-range-buttons">
              <button type="button" id="day-player-range-min" class="day-player-btn day-player-btn-secondary"></button>
              <button type="button" id="day-player-range-max" class="day-player-btn day-player-btn-secondary"></button>
            </div>
          </div>

          <div class="day-player-controls">
            <button type="button" id="day-player-prev" class="day-player-btn day-player-btn-nav" aria-label="Paso anterior">◀ Anterior</button>
            <button type="button" id="day-player-action" class="day-player-btn day-player-btn-primary">▶ Iniciar</button>
            <button type="button" id="day-player-next" class="day-player-btn day-player-btn-nav" aria-label="Paso siguiente">Siguiente ▶</button>
          </div>

          <div class="day-player-footer">
            <button type="button" id="day-player-finish" class="day-player-link-btn">Terminar práctica</button>
          </div>
        </div>

        <div id="day-player-finished-area" class="day-player-finished" hidden>
          <div class="day-player-finished-icon" aria-hidden="true">✓</div>
          <h4>¡Práctica completada!</h4>
          <p class="tracker-meta">Has terminado todas las posturas del día.</p>
          <div class="tracker-actions">
            <button type="button" id="day-player-finished-close" class="day-player-btn day-player-btn-primary">Volver al plan</button>
          </div>
        </div>
      </div>

      <div class="tracker-card">
        <h2 id="tracker-title">Plan 300</h2>
        <p id="tracker-course" class="tracker-meta"></p>
        <div id="tracker-week"><p class="tracker-meta">Cargando…</p></div>
        <div class="tracker-actions">
          <button id="tracker-prev">◀ Anterior</button>
          <button id="tracker-done">✓ Completar semana</button>
          <button id="tracker-next">Siguiente ▶</button>
        </div>
        <label class="tracker-goto">Ir a semana
          <input id="tracker-goto" type="number" min="1" max="300" inputmode="numeric">
        </label>
      </div>
      <div class="progress"><div id="tracker-bar"></div></div>
      <p id="tracker-text" class="tracker-meta"></p>
      <div class="tracker-actions">
        <button id="tracker-reset">Reiniciar</button>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="./day-player.js"></script>
  <script src="./tracker.js"></script>
</body>
</html>
